{% extends "base.html" %} {% block title %}Delete Organization · {{
organization.name }}{% endblock %} {% block content %}
<div class="">
  <h1>Delete Organization</h1>

  <p>
    Are you sure you want to delete the organization "<strong
      >{{ organization.name }}</strong
    >"?
  </p>

  <form method="post">
    {% csrf_token %}
    <button class="btn btn-sm btn-danger" type="submit">Yes, delete</button>
    <a href="{% url 'organization_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
