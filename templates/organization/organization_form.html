{% extends "base.html" %}
{% block title %}Create / Edit Organization{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <p class="eyebrow">Organization</p>
    <h1>Create / Edit Organization</h1>
    <p class="page-subtitle">Fill in the details below and save your changes.</p>
  </div>
</section>

<div class="form-card">
  <form method="post" class="modern-form">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Organization</button>
      <a href="{% url 'organization_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
